[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clustersentinel"
version = "0.1.0"
description = "AI-powered anomaly detection and RCA for HCI clusters"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.35",
    "langchain>=0.2",
    "langgraph>=0.1",
    "langchain-anthropic>=0.1",
    "langchain-ollama>=0.1",
    "anthropic>=0.28",
    "chromadb>=0.5",
    "prophet>=1.1",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "plotly>=5.20",
]

[project.scripts]
sentinel-sim = "scripts.run_simulation:app"
sentinel-train = "scripts.train_models:app"
sentinel-seed = "scripts.seed_knowledge_base:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
